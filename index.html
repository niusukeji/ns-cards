        // --- 辅助函数：将字符串分割成列表HTML ---
        function textToList(text) {
            if (!text) return '';
            // 兼容中文分号和英文分号分割，兼容数字编号开头（如1. 2.）
            const items = text.split(/[；;]/).filter(item => item.trim().length > 0);
            
            return items.map(item => {
                // 去除可能的 "1. ", "(1) " 等开头
                let cleanItem = item.trim().replace(/^[\d(（]+\s*[\d)）]*[、\.]?\s*/, '');
                return `<li class="flex items-start gap-2 mb-2 text-sm text-slate-600 leading-relaxed">
                    <span class="mt-1.5 w-1 h-1 rounded-full bg-slate-400 shrink-0"></span>
                    <span>${cleanItem}</span>
                 </li>`
            }).join('');
        }

                html += `

                    <div class="p-5">
                        <div class="flex justify-between items-start mb-3">

        }

        // 渲染内容块 (图标+标题+列表)
        function renderSectionBlock(title, iconName, iconColor, iconBg, textContent) {
            // 如果是“核心功能”，且没有明显的分号分隔，则作为段落显示，否则作为列表
            let contentHtml = '';
            if (title === '核心功能' && !textContent.includes('；') && !textContent.includes(';')) {
                contentHtml = `<p class="text-sm text-slate-600 leading-relaxed text-justify">${textContent}</p>`;
            } else {
                contentHtml = `<ul class="space-y-1">${textToList(textContent)}</ul>`;
            }

            return `
                <div class="flex gap-4">
                    <!-- 左侧图标圆圈 -->
                    <div class="shrink-0 mt-1">
                        <div class="w-8 h-8 rounded-full ${iconBg} ${iconColor} flex items-center justify-center shadow-sm">
                            <i data-lucide="${iconName}" class="w-4 h-4"></i>
                        </div>
                    </div>
                    <!-- 右侧内容 -->
                    <div class="flex-1">
                        <h4 class="font-bold text-slate-800 text-sm mb-2">${title}</h4>
                        ${contentHtml}
                    </div>
                </div>
            `;
        }

        // --- 电话弹窗逻辑 ---
        function openCallModal() {
            const modal = document.getElementById('call-modal-overlay');
            modal.classList.remove('hidden');
        }

        function closeCallModal() {
            const modal = document.getElementById('call-modal-overlay');
            modal.classList.add('hidden');
        }

        function makeCall() {
            window.location.href = 'tel:13915561401';
            closeCallModal();
        }

        // 关闭产品详情弹窗
        function closeModal(event) {
            if(event) event.stopPropagation();
            const modalOverlay = document.getElementById('modal-overlay');
            
            modalOverlay.classList.remove('modal-enter');
            modalOverlay.classList.add('modal-exit');
            
            setTimeout(() => {
                modalOverlay.classList.add('hidden');
                modalOverlay.classList.remove('modal-exit');
                document.body.style.overflow = '';
            }, 200);
        }

        renderCards();

    </script>
</body>
</html>
