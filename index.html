    <style>
        body { 
            -webkit-tap-highlight-color: transparent; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0f172a; 
        }
        
        /* 科技感网格背景 */
        .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 弹窗动画 */
        .modal-enter { animation: modalFadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .modal-content-enter { animation: modalSlideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .modal-exit { animation: modalFadeOut 0.2s forwards; }
        
        @keyframes modalFadeIn { from { opacity: 0; backdrop-filter: blur(0px); } to { opacity: 1; backdrop-filter: blur(8px); } }
        @keyframes modalFadeOut { from { opacity: 1; backdrop-filter: blur(8px); } to { opacity: 0; backdrop-filter: blur(0px); } }
        @keyframes modalSlideUp { from { transform: translateY(40px) scale(0.95); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }

        /* 呼吸灯动画 */
        .animate-glow { animation: glow 2s infinite alternate; }
        @keyframes glow {
            from { box-shadow: 0 0 5px -2px rgba(59, 130, 246, 0.5); }
            to { box-shadow: 0 0 15px 2px rgba(59, 130, 246, 0.8); }
        }

        /* 终端打字机光标效果模拟 */
        .tech-cursor::after {
            content: '_';
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* ================= 新增：雷达扫描加载页样式 ================= */
        .radar-container {
            position: relative;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            /* 刻度线与同心圆 */
            border: 2px solid rgba(59, 130, 246, 0.4);
            background: 
                radial-gradient(circle, transparent 30%, rgba(59, 130, 246, 0.1) 31%, transparent 32%, transparent 60%, rgba(59, 130, 246, 0.1) 61%, transparent 62%),
                linear-gradient(90deg, transparent 49.5%, rgba(59, 130, 246, 0.5) 49.5%, rgba(59, 130, 246, 0.5) 50.5%, transparent 50.5%),
                linear-gradient(0deg, transparent 49.5%, rgba(59, 130, 246, 0.5) 49.5%, rgba(59, 130, 246, 0.5) 50.5%, transparent 50.5%);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.2), inset 0 0 30px rgba(59, 130, 246, 0.2);
            overflow: hidden;
        }
        
        /* 旋转的扫描扇形 */
        .radar-container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 160px;
            height: 160px;
            background: conic-gradient(from 0deg, transparent 70%, rgba(59, 130, 246, 0.8) 100%);
            transform-origin: 0 0;
            animation: radar-spin 2s linear infinite;
        }

        /* 模拟雷达光点 */
        .radar-dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 8px #38bdf8;
            opacity: 0;
            animation: dot-flash 2s infinite;
        }

        @keyframes radar-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes dot-flash {
            0% { opacity: 0; transform: scale(0.5); }
            10% { opacity: 1; transform: scale(1.2); }
            20% { opacity: 0.8; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.8); }
        }

        /* 加载屏退场动画 */
        .loading-screen-exit {
            animation: fadeOutUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes fadeOutUp {
            from { opacity: 1; transform: translateY(0); backdrop-filter: blur(8px); }

            { id: 4, title: "城市生命线监测一体化", subtitle: "含四大核心板块", icon: "network", color: "from-cyan-600 to-cyan-900", lightColor: "bg-cyan-500/20", textColor: "text-cyan-400", summary: "覆盖管网设施、交通基建、特殊场所及地下空间，构建“监测—预警—处置—追溯”全闭环。", details: { type: "complex", subSections: [ { title: "管网设施类风险监测预警", themeColor: "from-cyan-700 to-cyan-900", baseColor: "cyan", advantages: "针对城市综合管网、PCCP管道、燃气管道及附属设施，采用分布式光纤传感、声波监测、压力传感等融合技术，构建一体化安全监测平台。通过专利非开挖技术植入传感器，实现泄漏、破损、断丝、压力异常等风险24小时不间断监测，借助GIS地图可视化呈现状态，结合大数据算法预判趋势，联动应急关阀与抢修队伍，形成全流程闭环管控，适配存量改造与新建运维场景。", painPoints: "管网布局复杂、存量管道老化严重，PCCP管道断丝、燃气管网微小泄漏等隐患隐蔽性强，传统检测难以精准识别，易引发爆管、路面塌陷事故；人工巡检效率低、成本高，无法有效防控第三方施工开挖破坏，且难以覆盖长距离、野外埋地管线；存量管网改造扰动大、成本高，新建与存量管线协同运维难度大，缺乏全生命周期监测手段；多部门数据割裂，无法联动地质沉降、偷排废料等关联风险研判，隐患定位模糊易延误处置；野外复杂环境下设备稳定性差，PCCP管道爆管后抢修周期长，损失易扩大", benefits: "全场景适配性强：兼容多介质管网及专项管道，兼顾存量改造与新建部署，覆盖阀门、井盖等附属设施；监测精准度高：隐患定位精度达米级，可捕捉单根断丝信号与≥95%的微小泄漏，支持地面敲击示踪定位，实现时空无盲区监测；低扰动低成本：非开挖安装不影响交通与居民生活，单根光纤长距离覆盖，借助富余光缆组网降低成本；快速应急响应：联动应急关阀装置与抢修队伍，缩短处置时间，减少介质损失与隐性影响；抗干扰能力突出：适配野外、埋地、潮湿环境，监测数据稳定可靠，不受电磁干扰" }, { title: "交通基建类风险监测预警", themeColor: "from-orange-600 to-orange-900", baseColor: "orange", advantages: "以分布式光纤传感技术为核心，整合结构应力传感、气象监测、AI视频抓拍等设备，构建全维度安全监测体系。针对桥梁、隧道、高速公路、铁路接触线、高铁无砟道轨等设施，精准监测结构形变、渗漏水、覆冰、边坡稳定等风险，搭配AI视频分析自动识别交通异常，联动交通管控平台实现分级预警、快速疏导与处置。", painPoints: "桥梁、道轨等结构隐患隐蔽且渐进，边坡滑坡、路基变形等风险难实时捕捉，传统定期检测易遗漏动态风险，易引发重大安全事故；极端天气加剧设施破损，接触线覆冰、路面结冰等隐患影响行车安全，交通异常事件发现不及时易引发二次事故；跨区域、跨部门协同管控不足，风险研判缺乏数据支撑，联动效率低；人工巡检受环境、时间限制，难以覆盖长距离线路及偏远风险点，运维效率低、难度大；对船只撞桩、水浪冲蚀桥梁等特殊风险管控薄弱，防控存在漏洞", benefits: "全维度风险覆盖：兼顾结构安全、运行环境与特殊风险，实现交通基建无死角管控；动态实时预警：精准捕捉隐患变化趋势，提前预警结构坍塌、接触线覆冰等风险，规避重大事故；智能高效联动：AI自动识别交通异常，联动多部门实现数据共享与快速疏导，减少人工干预；复杂场景适配：抗高温、高湿、强振动及恶劣气象，可稳定运行于边坡、偏远路基等特殊点位；运维成本可控：集中化平台实现远程监测，减少现场巡检频次，提升运维效率" }, { title: "特殊场所类风险监测预警", themeColor: "from-indigo-600 to-indigo-900", baseColor: "indigo", advantages: "针对化工、新能源等特殊场景定制差异化监测方案，全面覆盖化工企业反应器、高压容器、塔器、蒸汽管道等核心设备及LNG储罐、储能电池、风电站、光（电复合）缆等设施。采用分布式光纤传感、无源防爆设计，精准监测温度、压力、泄漏、振动等参数，支持与化工DCS系统、新能源管控平台无缝对接，形成“监测—预警—处置—复盘”全闭环。", painPoints: "化工企业核心设备类型多、工况复杂             { id: 5, title: "用电安全智慧监测系统", subtitle: "全域用电管控", icon: "zap", color: "from-blue-600 to-indigo-800", lightColor: "bg-blue-500/20", textColor: "text-blue-400", summary: "采用模块化设计打造全域用电管控方案，实现AI智能预测与远程无人值守。", details: { type: "product", advantages: "面向各类建筑、厂区配电房，采用模块化设计打造全域用电管控方案，实现多维度监测、AI智能预测、远程无人值守与快速故障处置，适配新建及老旧配电房改造需求，推动用电运维从被动应对向主动预防转型，保障配电系统安全稳定运行。", painPoints: "人工巡检效率低、标准不一，漏检风险高，无法全面防控用电隐患；用电隐患预警滞后，易引发电气安全事故，造成人员与财产损失；配电数据孤立形成数据孤岛，难以集中管控与统筹分析；运维成本冗余，应急处置流程不完善，故障响应与修复效率低", benefits: "合作资源雄厚：与上市公司上海良信电器深度合作，兼具技术优势与经济实力；适配性与经济性佳：模块化设计适配各类场景，改造部署成本低，性价比突出；运维高效便捷：全域多维度采集数据，支持远程无人值守，大幅减少人工投入；预警精准：AI故障预测准确率超95%，可减少80%巡检频次，降低运维负荷；处置快速：故障处置时间压缩至30分钟内，大幅降低停电损失，保障生产连续性" } },

        function textToList(text, colorTheme = 'blue') {
            if (!text) return '';
            const items = text.split(/[；;]/).filter(item => item.trim().length > 0);
            return items.map((item, index) => {
                let cleanItem = item.trim().replace(/^[\d(（]+\s*[\d)）]*[、\.]?\s*/, '');
                let numStr = (index + 1).toString().padStart(2, '0');
                return `<li class="flex items-start gap-3 mb-3 text-sm text-slate-300/90 leading-relaxed group/item">
                    <span class="mt-0.5 font-mono text-[10px] text-${colorTheme}-400 border border-${colorTheme}-500/30 bg-${colorTheme}-500/10 px-1.5 py-0.5 rounded shrink-0 shadow-[0_0_8px_currentColor] opacity-70 group-hover/item:opacity-100 transition-opacity">v${numStr}</span>
                    <span class="group-hover/item:text-white transition-colors">${cleanItem}</span>
                 </li>`
            }).join('');
        }

        function renderCards() {
            const container = document.getElementById('card-container');
            let html = '';

            cardData.forEach(card => {
                const isProfile = card.isProfile;
                // 注意：这里给外层加了 opacity-0 和 translate-y-8，为了配合 Scroll Reveal 动画
                html += `
                <div onclick="openModal(${card.id})" 
                     class="group relative bg-slate-800/40 backdrop-blur-md rounded-2xl border border-slate-700/80 hover:border-blue-500/50 hover:shadow-[0_0_20px_rgba(59,130,246,0.15)] transition-all duration-300 overflow-hidden active:scale-[0.98] cursor-pointer opacity-0 translate-y-8">
                    
                    ${isProfile ? '' : `<div class="bg-gradient-to-r ${card.color} h-1 w-full opacity-70 group-hover:opacity-100 transition-opacity"></div>`}
                    
                    <div class="p-5">
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex items-center gap-3">
                                <div class="p-2.5 rounded-xl ${card.lightColor} ${card.textColor} border border-white/5">
                                    <i data-lucide="${card.icon}" class="w-6 h-6 drop-shadow-md"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-lg text-white leading-tight">${card.title}</h3>
                                    <span class="inline-block mt-1 px-2 py-0.5 bg-slate-700/50 text-blue-400 border border-slate-600/50 rounded text-[10px] font-medium tracking-wide">
                                        ${card.subtitle}
                                    </span>
                                </div>
                            </div>
                        </div>
                        <p class="text-sm text-slate-400 leading-relaxed mb-4 line-clamp-2">${card.summary}</p>
                        <div class="flex justify-end pt-3 border-t border-slate-700/50">
                            <div class="flex items-center gap-1 text-sm font-bold text-blue-400 group-hover:text-blue-300 transition-colors">
                                查看图谱 <i data-lucide="arrow-right-circle" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
            container.innerHTML = html;
            lucide.createIcons();
        }

        // --- 核心：打开科技感弹窗 ---
        function openModal(id) {
            const card = cardData.find(c => c.id === id);
            if (!card) return;

            const modalOverlay = document.getElementById('modal-overlay');
            const modalContent = document.getElementById('modal-scroll-container');
            let contentHtml = '';

            if (card.isProfile) {
                const tagsHtml = card.tags.map(tag => `<span class="px-3 py-1 bg-blue-500/10 rounded-sm text-xs text-blue-300 border border-blue-500/30 shadow-[0_0_10px_rgba(59,130,246,0.1)] font-mono tracking-wide">${tag}</span>`).join('');
                contentHtml = `
                    <div class="p-6 min-h-[500px] flex flex-col relative overflow-hidden pb-20">
                        <button onclick="closeModal(event)" class="absolute top-4 right-4 p-2 bg-slate-800/80 rounded-lg hover:bg-slate-700 border border-slate-600 z-20 transition-colors">
                            <i data-lucide="x" class="w-5 h-5 text-slate-300"></i>
                        </button>
                        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-600 to-indigo-600"></div>
                        <i data-lucide="${card.icon}" class="absolute -right-10 -top-10 w-64 h-64 text-blue-500 opacity-5 pointer-events-none"></i>
                        <div class="mb-8 relative z-10 pt-4">
                            <div class="flex items-center gap-2 mb-3">
                                <span class="relative flex h-2 w-2">
                                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                                  <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span>
                                </span>
                                <div class="text-[10px] font-mono text-blue-400 tracking-widest uppercase">SYS.INIT // PROFILE</div>
                            </div>
                            <h2 class="text-3xl font-black mb-1 text-white tracking-wider">${card.title}</h2>
                            <p class="text-blue-400/80 text-sm font-mono tech-cursor">${card.subtitle}</p>
                        </div>
                        <div class="bg-slate-800/40 rounded-xl p-6 border border-slate-700/80 backdrop-blur-sm mb-6 flex-1 shadow-inner relative">
                            <div class="absolute top-0 left-0 w-2 h-2 border-t-2 border-l-2 border-blue-500"></div>
                            <div class="absolute bottom-0 right-0 w-2 h-2 border-b-2 border-r-2 border-blue-500"></div>
                            <p class="text-sm text-slate-300 leading-7 mb-4 indent-8 text-justify">${card.details.intro}</p>
                            <p class="text-sm text-slate-300 leading-7 mb-4 indent-8 text-justify">${card.details.desc2}</p>
                            <p class="text-sm text-slate-300 leading-7 indent-8 text-justify">${card.details.desc3}</p>
                        </div>
                        <div class="flex flex-wrap gap-3 mt-auto">${tagsHtml}</div>
                    </div>
                `;
            } else if (card.details.type === 'complex') {
                contentHtml += renderProductHeader(card);
                contentHtml += `<div class="p-5 space-y-6 pb-20 relative z-20 -mt-2">`; 
                card.details.subSections.forEach((section) => {
                    const themeClass = section.baseColor || 'blue';
                    contentHtml += `
                        <div class="bg-slate-800/60 rounded-xl overflow-hidden border border-slate-700 shadow-lg relative group">
                             <div class="absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-b ${section.themeColor} opacity-80"></div>
                             <div class="bg-slate-800/80 border-b border-slate-700/50 px-5 py-3 flex items-center justify-between">
                                <span class="text-white font-bold text-[15px] truncate pr-2 tracking-wide flex items-center gap-2">
                                    <i data-lucide="folder-check" class="w-4 h-4 text-${themeClass}-400"></i>
                                    ${section.title}
                                </span>
                             </div>
                             <div class="p-5 space-y-5">
                                ${renderSectionBlock('核心监测能力', 'activity', `text-${themeClass}-400`, `bg-${themeClass}-500/20`, section.advantages, themeClass)}
                                ${renderSectionBlock('行业痛点攻克', 'alert-triangle', 'text-amber-400', 'bg-amber-500/20', section.painPoints, 'amber')}
                                ${renderSectionBlock('系统核心亮点', 'zap', 'text-emerald-400', 'bg-emerald-500/20', section.benefits, 'emerald')}
                             </div>
                        </div>
                    `;
                });
                contentHtml += renderProductFooter();
                contentHtml += `</div>`;
            } else {
                contentHtml += renderProductHeader(card);
                contentHtml += `
                    <div class="p-5 space-y-5 min-h-[400px] pb-20 relative z-20 -mt-2">
                        ${renderSectionBlock('系统架构与功能', 'server', 'text-blue-400', 'bg-blue-500/20', card.details.advantages, 'blue')}
                        ${renderSectionBlock('传统痛点攻克', 'alert-triangle', 'text-amber-400', 'bg-amber-500/20', card.details.painPoints, 'amber')}
                        ${renderSectionBlock('技术优势核心', 'shield-check', 'text-emerald-400', 'bg-emerald-500/20', card.details.benefits, 'emerald')}
                        ${renderProductFooter()}
                    </div>
                `;
            }

            modalContent.innerHTML = contentHtml;
            modalContent.scrollTop = 0;
            modalOverlay.classList.remove('hidden');
            modalOverlay.classList.add('modal-enter');
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        }

        function renderProductHeader(card) {
            return `
                <div class="bg-gradient-to-br ${card.color} p-6 pb-12 text-white relative overflow-hidden shrink-0 rounded-t-2xl">
                    <button onclick="closeModal(event)" class="absolute top-4 right-4 p-2 bg-black/30 rounded-lg hover:bg-black/50 z-20 backdrop-blur-sm transition-colors border border-white/10">
                        <i data-lucide="x" class="w-5 h-5 text-white/80"></i>
                    </button>
                    <div class="absolute inset-0 opacity-20 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-white/20 via-transparent to-transparent"></div>
                    <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjEiIGZpbGw9InJnYmEoMjU1LDI1NSwyNTUsMC4xNSkiLz48L3N2Zz4=')]"></div>
                    <i data-lucide="${card.icon}" class="absolute -right-4 -bottom-8 w-40 h-40 text-white opacity-10 rotate-12 drop-shadow-2xl"></i>
                    <div class="relative z-10 pt-2">
                        <div class="flex items-center gap-2 mb-4">
                            <span class="inline-flex items-center gap-1.5 px-3 py-1 bg-black/40 rounded-full text-xs font-mono backdrop-blur-md border border-green-500/30 shadow-[inset_0_0_10px_rgba(34,197,94,0.1)]">
                                <span class="relative flex h-2 w-2">
                                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                                  <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                                </span>
                                <span class="text-green-400 tracking-wider text-[10px]">SYSTEM.ON</span>
                            </span>
                            <span class="inline-flex items-center px-3 py-1 bg-white/10 rounded-full text-[10px] font-medium backdrop-blur-md border border-white/20 text-white/90 tracking-wide">
                                ${card.subtitle}
                            </span>
                        </div>
                        <h2 class="text-2xl font-black leading-tight pr-8 tracking-wider drop-shadow-md">${card.title}</h2>
                    </div>
                </div>
            `;
        }

        function renderProductFooter() {
            return `
                <div class="mt-8 pt-6 border-t border-slate-700/50 flex justify-between items-center text-[10px] text-slate-500 font-mono tracking-widest uppercase">
                    <span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 bg-blue-500 rounded-full"></span> NIUSU TECH</span>
                    <span>DATALINK // SECURE</span>
                </div>
            `;
        }

        function renderSectionBlock(title, iconName, iconColor, iconBg, textContent, themeColor = 'blue') {
            let contentHtml = '';
            if (title.includes('架构') || (title.includes('能力') && !textContent.includes('；') && !textContent.includes(';'))) {
                contentHtml = `<p class="text-sm text-slate-300 leading-relaxed text-justify bg-slate-900/50 p-4 rounded-lg border border-slate-700/50 shadow-inner">${textContent}</p>`;
            } else {
                contentHtml = `<ul class="space-y-1">${textToList(textContent, themeColor)}</ul>`;
            }
            const solidColorClass = iconBg.replace('/20', '');
            return `
                <div class="relative group bg-slate-800/40 rounded-xl border border-slate-700/60 p-5 overflow-hidden transition-all hover:bg-slate-800/70 hover:border-slate-600/60">
                    <div class="absolute left-0 top-0 bottom-0 w-1 ${solidColorClass} opacity-60 group-hover:opacity-100 transition-opacity"></div>
                    <div class="flex items-center gap-3 mb-4">
                        <div class="w-8 h-8 rounded-lg ${iconBg} ${iconColor} flex items-center justify-center border border-current/20 shadow-[0_0_10px_currentColor] opacity-90 group-hover:scale-110 transition-transform">
                            <i data-lucide="${iconName}" class="w-4 h-4"></i>
                        </div>
                        <h4 class="font-bold text-slate-100 text-[15px] tracking-wide">${title}</h4>
                        <div class="flex-1 h-[1px] bg-gradient-to-r from-slate-700 to-transparent ml-2 mt-1"></div>
                    </div>
                    <div class="pl-1">${contentHtml}</div>
                </div>
            `;
        }

        function openCallModal() { document.getElementById('call-modal-overlay').classList.remove('hidden'); }
        function closeCallModal() { document.getElementById('call-modal-overlay').classList.add('hidden'); }
        function makeCall() { window.location.href = 'tel:13915561401'; closeCallModal(); }
        function closeModal(event) {
            if(event) event.stopPropagation();
            const modalOverlay = document.getElementById('modal-overlay');
            modalOverlay.classList.remove('modal-enter');
            modalOverlay.classList.add('modal-exit');
            setTimeout(() => {
                modalOverlay.classList.add('hidden');
                modalOverlay.classList.remove('modal-exit');
                document.body.style.overflow = '';
            }, 200);
        }

        // ================= 新增：滚动渐显动画与开场动画生命周期 =================

        // 1. 卡片滚动渐显观察器
        const cardObserver = new IntersectionObserver((entries, observer) => {
            entries.forEach((entry, index) => {
                if (entry.isIntersecting) {
                    // 使用极短的延迟，让同时出现的卡片有梯次感
                    setTimeout(() => {
                        entry.target.classList.remove('opacity-0', 'translate-y-8');
                        entry.target.classList.add('opacity-100', 'translate-y-0');
                    }, index * 120);
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });

        // 将所有卡片加入观察队列
        function initScrollAnimations() {
            const cards = document.querySelectorAll('#card-container > div');
            cards.forEach(card => cardObserver.observe(card));
        }

        // 2. 页面加载完成后的雷达动画控制
        window.addEventListener('DOMContentLoaded', () => {
            // 先渲染卡片 DOM (此时卡片默认是透明并下移的)
            renderCards();

            const loadingScreen = document.getElementById('loading-screen');
            const loadingText = document.getElementById('loading-text');
            const progressBar = document.getElementById('progress-bar');

            // 触发进度条动画
            setTimeout(() => { progressBar.style.width = '100%'; }, 100);

            // 模拟终端日志文本切换
            setTimeout(() => { loadingText.innerText = "VERIFYING SECURITY CREDENTIALS..."; }, 800);
            setTimeout(() => { 
                loadingText.innerText = "ACCESS GRANTED // SYSTEM READY"; 
                loadingText.classList.remove('text-blue-500/70');
                loadingText.classList.add('text-green-400');
            }, 1800);

            // 2.4秒后隐藏加载屏，并触发下方卡片的渐显动画
            setTimeout(() => {
                loadingScreen.classList.add('loading-screen-exit');
                // 等待淡出动画进行一半时，开始显示卡片，衔接更丝滑
                setTimeout(() => {
                    initScrollAnimations();
                }, 200);
            }, 2400);
        });

    </script>
</body>
</html>
