            display: inline-block; 
            width: 1em;
            margin-left: -1em;

        // --- 辅助函数：将字符串分割成列表HTML ---
        // 模拟图片中的 Bullet Points 效果
        function textToList(text) {
            if (!text) return '';
            // 按分号或中文逗号分割，如果句子太短就不分割
            const items = text.split(/[；;]/).filter(item => item.trim().length > 0);
            return items.map(item => 
                `<li class="flex items-start gap-2 mb-1.5 text-sm text-slate-600 leading-snug">
                    <span class="mt-1.5 w-1 h-1 rounded-full bg-slate-400 shrink-0"></span>
                    <span>${item}</span>
                 </li>`
            ).join('');
        }

        // --- 渲染列表 ---

                const isProfile = card.isProfile;
                const iconColor = isProfile ? "text-blue-600" : card.textColor;
                const bgClass = isProfile ? "bg-slate-900" : "bg-white";
                const titleColor = isProfile ? "text-white" : "text-slate-800";
                
                html += `
                <div onclick="openModal(${card.id})" 
                     class="group relative ${bgClass} rounded-2xl shadow-sm border border-slate-100 hover:shadow-lg hover:-translate-y-1 transition-all duration-300 overflow-hidden active:scale-95">
                    
                    ${isProfile ? '' : `<div class="${card.color} h-1.5 w-full"></div>`}
                    
                    <div class="p-5">
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex items-center gap-3">
                                <div class="p-2.5 rounded-xl ${isProfile ? 'bg-white/10 text-white' : `${card.lightColor} ${card.textColor}`}">
                                    <i data-lucide="${card.icon}" class="w-6 h-6"></i>
                                </div>
                                <div>
                                    <h3 class="font-bold text-lg ${titleColor} leading-tight">
                                        ${card.title}
                                    </h3>
                                    <span class="inline-block mt-1 px-2 py-0.5 ${isProfile ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-500'} rounded text-[10px] font-medium">
                                        ${card.subtitle}
                                    </span>
                                </div>
                            </div>
                        </div>
                        
                        <p class="text-sm ${isProfile ? 'text-slate-300' : 'text-slate-500'} leading-relaxed mb-4">
                            ${card.summary}
                        </p>

                        <!-- 右下角查看详情按钮 -->
                        <div class="flex justify-end pt-2 border-t ${isProfile ? 'border-slate-700' : 'border-slate-50'}">

                            </div>
                        </div>
                    </div>

            });

            container.innerHTML = html;
            lucide.createIcons();
        }

                                <span class="text-white font-bold text-sm truncate pr-2">${section.title}</span>
                                <i data-lucide="layers" class="text-white/50 w-4 h-4"></i>
                             </div>
                             
                             <div class="p-5 space-y-5">
                                ${renderSectionBlock('产品优势', 'check-circle-2', 'text-blue-500', 'bg-blue-50', section.advantages)}
                                ${renderSectionBlock('痛点难点', 'alert-circle', 'text-amber-500', 'bg-amber-50', section.painPoints)}
                                ${renderSectionBlock('经济效益', 'trending-up', 'text-emerald-500', 'bg-emerald-50', section.benefits)}
                             </div>
                        </div>
                    `;
                });
                
                contentHtml += `</div>`;
                contentHtml += renderProductFooter();
            }
            // 3. 标准产品布局 (对应图片2、3)
            else {
                // Header
                contentHtml += renderProductHeader(card);

                // Body
                contentHtml += `
                    <div class="bg-white p-6 space-y-6 min-h-[400px]">
                        ${renderSectionBlock('产品优势', 'check-circle-2', 'text-blue-600', 'bg-blue-50', card.details.advantages)}
                        ${renderSectionBlock('痛点难点', 'alert-circle', 'text-amber-500', 'bg-amber-50', card.details.painPoints)}
                        ${renderSectionBlock('经济效益', 'trending-up', 'text-emerald-600', 'bg-emerald-50', card.details.benefits)}
                    </div>
                `;

                // Footer
                contentHtml += renderProductFooter();
            }

            modalContent.innerHTML = contentHtml;
            
            // 显示
            modalOverlay.classList.remove('hidden');
            modalOverlay.classList.add('modal-enter');
            modalContent.classList.add('modal-content-enter');
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        }

        // --- 辅助渲染函数 ---

        // 渲染产品详情页头部 (模仿图片2顶部)
        function renderProductHeader(card) {
            return `
                <div class="${card.color} p-6 pb-8 text-white relative overflow-hidden shrink-0">
                    <button onclick="closeModal(event)" class="absolute top-4 right-4 p-2 bg-black/10 rounded-full hover:bg-black/20 z-20">
                        <i data-lucide="x" class="w-5 h-5 text-white"></i>
                    </button>
                    <!-- 水印图标 -->
                    <i data-lucide="${card.icon}" class="absolute right-4 bottom-[-10px] w-32 h-32 text-white opacity-10 rotate-12"></i>
                    
                    <div class="relative z-10">
                        <span class="inline-block px-3 py-1 bg-white/20 rounded-full text-xs font-medium backdrop-blur-sm mb-3">
                            ${card.subtitle}
                        </span>
                        <h2 class="text-2xl font-bold leading-tight pr-8">${card.title}</h2>
                    </div>
                </div>
                <!-- 弧形连接处(可选装饰) -->
                <div class="h-4 bg-white -mt-4 rounded-t-2xl relative z-10 mx-2"></div>
            `;
        }

        // 渲染底部 footer
        function renderProductFooter() {
            return `
                <div class="bg-white border-t border-slate-100 p-3 flex justify-between items-center text-[10px] text-slate-300 font-bold tracking-widest uppercase rounded-b-2xl">
                    <span>NIUSU TECH</span>
                    <span>SMART IOT SOLUTION</span>
                </div>
            `;
        }

        // 渲染内容块 (图标+标题+列表)
        function renderSectionBlock(title, iconName, iconColor, iconBg, textContent) {
            return `
                <div class="flex gap-4">
                    <!-- 左侧图标圆圈 -->
                    <div class="shrink-0 mt-1">
                        <div class="w-8 h-8 rounded-full ${iconBg} ${iconColor} flex items-center justify-center">
                            <i data-lucide="${iconName}" class="w-4 h-4"></i>
                        </div>
                    </div>
                    <!-- 右侧内容 -->
                    <div class="flex-1">
                        <h4 class="font-bold text-slate-800 text-sm mb-2">${title}</h4>
                        <ul class="space-y-1">
                            ${textToList(textContent)}
                        </ul>
                    </div>
                </div>
            `;
        }

        // 关闭弹窗
        function closeModal(event) {
            if(event) event.stopPropagation();
            const modalOverlay = document.getElementById('modal-overlay');
            const modalContent = document.getElementById('modal-content');
            
            modalOverlay.classList.remove('modal-enter');
            modalContent.classList.remove('modal-content-enter');
            modalOverlay.classList.add('modal-exit');
            modalContent.classList.add('modal-content-exit');
            
            setTimeout(() => {
                modalOverlay.classList.add('hidden');
                modalOverlay.classList.remove('modal-exit');
                modalContent.classList.remove('modal-content-exit');
                document.body.style.overflow = '';
            }, 200);
        }

        renderCards();

    </script>
</body>

</html>
